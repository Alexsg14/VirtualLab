name: Publicar laboratorio en Pages

# Manual only: committing or pushing to main never publishes the website.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar química y cálculos
        run: npm test
      - name: Preparar compilador LaTeX y fuentes
        run: npm run preparar:latex
      - name: Compilar laboratorio
        run: npm run build
      - name: Instalar navegador de comprobación
        run: npx playwright install --with-deps chromium
      - name: Comprobar contraste y señales visuales
        run: npm run test:colors
      - name: Comprobar seguimiento del cartel al girar la cámara
        run: npm run test:instrument-panel
      - name: Comprobar web estática y PDF sin servicios externos
        run: npm run test:pages
      - name: Preparar archivo para Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Comprobar configuración de Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publicar versión comprobada
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4